<div class="container">
  <mat-card-header>
    <mat-card-title>
      <mat-toolbar>
        <mat-icon>school</mat-icon>
        <span>Gestión de Escuelas de Conducción</span>
      </mat-toolbar>
    </mat-card-title>
  </mat-card-header>

  <app-escuela-busqueda (search)="onSearch($event)" (clear)="onClear()"></app-escuela-busqueda>

  @if (isLoading()) {
  <div class="loading-container">
    <mat-spinner></mat-spinner>
    <p>Cargando escuelas...</p>
  </div>
  }

  @if (isError()) {
  <mat-card appearance="outlined" class="error-card">
    <mat-card-content>
      <mat-icon color="warn">error</mat-icon>
      <p>Error al cargar las escuelas. Por favor, intente nuevamente.</p>
    </mat-card-content>
  </mat-card>
  }

  @if (!isLoading() && !isError()) {
  <app-escuela-tabla [escuelas]="escuelas()" [pageInfo]="pageInfo()" (action)="onTableAction($event)" (pageChange)="onPageChange($event)"></app-escuela-tabla>
  }
</div>
