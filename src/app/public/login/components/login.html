<div class="login-page">
  <app-public-navbar [showLoginButton]="false"></app-public-navbar>

  <div class="login-container">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Iniciar Sesión</mat-card-title>
        <mat-card-subtitle>Ingresa tus credenciales para continuar</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="loginForm" >
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Usuario</mat-label>
            <input matInput formControlName="username" required />
            <mat-icon matPrefix>person</mat-icon>

            @if (loginForm.controls['username']?.hasError('required')) {
            <mat-error>
              El usuario es requerido
            </mat-error>
            }

          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required />
            <mat-icon matPrefix>lock</mat-icon>
            <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>

            @if (loginForm.controls['password']?.hasError('required')) {
            <mat-error>
              La contraseña es requerida
            </mat-error>
            }

          </mat-form-field>

          <button mat-raised-button color="primary" (click)="login()" class="login-button" [disabled]="loginForm.invalid">
            Iniciar Sesión
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>

  <app-footer-component></app-footer-component>
</div>
